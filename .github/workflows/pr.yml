name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck on shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  test:
    name: Verify Config and Engine
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test suite
        run: bash test/verify.sh

  results:
    name: PR Results
    needs: [shellcheck, test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
