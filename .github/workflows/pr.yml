name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run shellcheck on shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  test:
    name: Verify Config and Engine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run test suite
        run: bash test/verify.sh

  results:
    name: PR Results
    needs: [shellcheck, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - uses: bcgov/actions/workflow-results@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          needs: ${{ toJson(needs) }}
