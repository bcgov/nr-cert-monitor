name: SSL Expiry Monitor

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ssl-expiry.yml'
      - 'scripts/check-certs.sh'
      - 'scripts/manage-issues.sh'

permissions: {}

jobs:
  check-ssl:
    name: Check SSL/TLS Expiry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect SSL/TLS Certificates
        id: cert-audit
        run: bash scripts/check-certs.sh rules.yml

      - name: Manage GitHub Alert Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "false"
          TITLE_PREFIX: ${{ steps.cert-audit.outputs.title_prefix }}
          LABELS: ${{ steps.cert-audit.outputs.labels }}
          BREACHES_FILE: ${{ steps.cert-audit.outputs.breaches_file }}
          HEALTHY_FILE: ${{ steps.cert-audit.outputs.healthy_file }}
        run: bash scripts/manage-issues.sh

  check-ssl-pr:
    name: Check SSL/TLS Expiry (Dry Run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect SSL/TLS Certificates
        id: cert-audit
        run: bash scripts/check-certs.sh rules.yml

      - name: Dry-Run GitHub Alert Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "true"
          TITLE_PREFIX: ${{ steps.cert-audit.outputs.title_prefix }}
          LABELS: ${{ steps.cert-audit.outputs.labels }}
          BREACHES_FILE: ${{ steps.cert-audit.outputs.breaches_file }}
          HEALTHY_FILE: ${{ steps.cert-audit.outputs.healthy_file }}
        run: bash scripts/manage-issues.sh
