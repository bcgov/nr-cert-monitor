name: SSL Expiry Monitor

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-ssl:
    name: Check SSL/TLS Expiry
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect SSL/TLS Certificates
        id: cert-audit
        run: bash scripts/check-certs.sh rules.yml

      - name: Manage GitHub Alert Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: ${{ steps.cert-audit.outputs.title_prefix }}
          LABELS: ${{ steps.cert-audit.outputs.labels }}
          BREACHES_FILE: ${{ steps.cert-audit.outputs.breaches_file }}
          HEALTHY_FILE: ${{ steps.cert-audit.outputs.healthy_file }}
        run: |
          if [ -n "$LABELS" ]; then
            IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
            for lbl in "${LABEL_ARRAY[@]}"; do
              lbl=$(echo "$lbl" | xargs)
              if [ -n "$lbl" ]; then
                gh label create "$lbl" --force 2>/dev/null || true
              fi
            done
          fi

          if [ -f "$BREACHES_FILE" ]; then
            ALERT_ISSUES_FILE=$(mktemp)
            while IFS= read -r breach; do
              [ -z "$breach" ] && continue
              host=$(echo "$breach" | jq -r '.host')
              desc=$(echo "$breach" | jq -r '.description')
              port=$(echo "$breach" | jq -r '.port')
              status=$(echo "$breach" | jq -r '.status')
              expiry_date=$(echo "$breach" | jq -r '.expiry_date')
              days_left=$(echo "$breach" | jq -r '.days_left')
              assignees=$(echo "$breach" | jq -r '.assignees')

              search_prefix="${TITLE_PREFIX}${host}"
              if [ "$days_left" != "null" ] && [ "$days_left" != "N/A" ]; then
                issue_title="${search_prefix} (${days_left}d remaining)"
                days_display="${days_left}d"
              else
                issue_title="${search_prefix} (unreachable)"
                days_display="N/A"
              fi

              remaining_label="${days_display} remaining"
              if [ "$days_display" = "N/A" ]; then
                remaining_label="unreachable"
              fi

              display_host="$host"
              [ "$port" != "443" ] && display_host="${host}:${port}"

              BODY_FILE=$(mktemp)
              {
                echo "### ⚠️ SSL/TLS Certificate Expiry Alert: $host"
                echo ""
                echo "The domain **$host** ($desc) requires attention due to upcoming SSL/TLS certificate expiration or connection failure."
                echo ""
                echo "| Status | Host | Description | Expiry Date | Days Left |"
                echo "| :--- | :--- | :--- | :--- | :--- |"
                echo "| $status | $display_host | $desc | $expiry_date | $days_display |"
                echo ""
                echo "**Renew / update:** [route-tls CSR and cert update](https://github.com/bcgov/actions-openshift/blob/main/route-tls/README.md#no-cert-yet-csr-and-update)"
              } > "$BODY_FILE"

              EXISTING_ISSUE=$(gh issue list --state open --json number,title --jq ".[] | select(.title | startswith(\"$search_prefix\")) | .number" | head -n 1)

              if [ -z "$EXISTING_ISSUE" ]; then
                # Adopt legacy batch issue if matching this domain
                LEGACY_ISSUE=$(gh issue list --state open --json number,title,body --jq ".[] | select(.title | test(\"^${TITLE_PREFIX}[0-9]+ domain\")) | select(.body | contains(\"$host\")) | .number" | head -n 1)
                if [ -n "$LEGACY_ISSUE" ]; then
                  EXISTING_ISSUE="$LEGACY_ISSUE"
                fi
              fi

              if [ -n "$EXISTING_ISSUE" ]; then
                echo "Updating existing open issue #$EXISTING_ISSUE for $host"
                EDIT_ARGS=("$EXISTING_ISSUE" --title "$issue_title")
                if [ -n "$assignees" ]; then
                  EDIT_ARGS+=(--add-assignee "$assignees")
                fi
                if [ -n "$LABELS" ]; then
                  EDIT_ARGS+=(--add-label "$LABELS")
                fi
                gh issue edit "${EDIT_ARGS[@]}"
                gh issue comment "$EXISTING_ISSUE" --body-file "$BODY_FILE"

                if [ -n "$desc" ] && [ "$desc" != "$host" ]; then
                  echo "- **$desc** (\`$host\`): Updated alert issue #$EXISTING_ISSUE ($remaining_label)." >> "$ALERT_ISSUES_FILE"
                else
                  echo "- \`$host\`: Updated alert issue #$EXISTING_ISSUE ($remaining_label)." >> "$ALERT_ISSUES_FILE"
                fi
              else
                echo "Creating new alert issue for $host"
                CREATE_ARGS=(--title "$issue_title" --body-file "$BODY_FILE")
                if [ -n "$assignees" ]; then
                  CREATE_ARGS+=(--assignee "$assignees")
                fi
                if [ -n "$LABELS" ]; then
                  CREATE_ARGS+=(--label "$LABELS")
                fi
                NEW_ISSUE_URL=$(gh issue create "${CREATE_ARGS[@]}")
                NEW_ISSUE_NUM=$(echo "$NEW_ISSUE_URL" | grep -oE '[0-9]+$' || echo "")

                issue_ref="#${NEW_ISSUE_NUM}"
                [ -z "$NEW_ISSUE_NUM" ] && issue_ref="$NEW_ISSUE_URL"

                if [ -n "$desc" ] && [ "$desc" != "$host" ]; then
                  echo "- **$desc** (\`$host\`): Created alert issue $issue_ref ($remaining_label)." >> "$ALERT_ISSUES_FILE"
                else
                  echo "- \`$host\`: Created alert issue $issue_ref ($remaining_label)." >> "$ALERT_ISSUES_FILE"
                fi
              fi
              rm -f "$BODY_FILE"
            done < <(jq -c '.[]' "$BREACHES_FILE" 2>/dev/null || true)

            if [ -s "$ALERT_ISSUES_FILE" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo ""
                echo "### ⚠️ Alert Issues"
                echo ""
                cat "$ALERT_ISSUES_FILE"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$ALERT_ISSUES_FILE"
          fi

          if [ -f "$HEALTHY_FILE" ]; then
            RESOLVED_FILE=$(mktemp)
            while IFS= read -r healthy; do
              [ -z "$healthy" ] && continue
              host=$(echo "$healthy" | jq -r '.host')
              desc=$(echo "$healthy" | jq -r '.description')
              expiry_date=$(echo "$healthy" | jq -r '.expiry_date')
              days_left=$(echo "$healthy" | jq -r '.days_left')

              search_prefix="${TITLE_PREFIX}${host}"
              OPEN_ISSUES=$(gh issue list --state open --json number,title --jq ".[] | select(.title | startswith(\"$search_prefix\")) | @json")

              if [ -n "$OPEN_ISSUES" ]; then
                while IFS= read -r issue_json; do
                  [ -z "$issue_json" ] && continue
                  issue_num=$(echo "$issue_json" | jq -r '.number')
                  issue_title=$(echo "$issue_json" | jq -r '.title')

                  prev_state="expiring"
                  if [[ "$issue_title" =~ unreachable ]]; then
                    prev_state="unreachable"
                  elif [[ "$issue_title" =~ -[0-9]+d[[:space:]]remaining ]]; then
                    prev_state="expired"
                  fi

                  echo "Resolving and closing issue #$issue_num: certificate for $host is renewed/healthy ($expiry_date, ${days_left}d remaining)"
                  gh issue close "$issue_num" \
                    --comment "✅ **SSL/TLS Certificate Renewed:** The certificate for **$host** has been renewed/updated. It expires in ${days_left} days ($expiry_date). Automatically resolving and closing this alert." \
                    --reason "completed"

                  remaining_display=""
                  if [ -n "$days_left" ] && [ "$days_left" != "N/A" ] && [ "$days_left" != "null" ]; then
                    remaining_display=" (${days_left}d remaining)"
                  fi

                  if [ -n "$desc" ] && [ "$desc" != "$host" ]; then
                    echo "- **$desc** (\`$host\`) turned from $prev_state to good, issue #$issue_num closed${remaining_display}." >> "$RESOLVED_FILE"
                  else
                    echo "- **$host** turned from $prev_state to good, issue #$issue_num closed${remaining_display}." >> "$RESOLVED_FILE"
                  fi
                done <<< "$OPEN_ISSUES"
              fi
            done < <(jq -c '.[]' "$HEALTHY_FILE" 2>/dev/null || true)

            if [ -s "$RESOLVED_FILE" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo ""
                echo "### 🔄 Resolved Issues"
                echo ""
                cat "$RESOLVED_FILE"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$RESOLVED_FILE"
          fi
